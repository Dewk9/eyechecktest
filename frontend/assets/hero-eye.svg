<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-label="ภาพประกอบเทคโนโลยี AI วิเคราะห์ภาพดวงตา">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f5fd"/>
      <stop offset="1" stop-color="#e5f8ef"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3aa9e6"/>
      <stop offset=".65" stop-color="#0b6fb3"/>
      <stop offset="1" stop-color="#073f66"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34c38f" stop-opacity="0"/>
      <stop offset=".5" stop-color="#34c38f"/>
      <stop offset="1" stop-color="#34c38f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="480" height="400" rx="36" fill="url(#bg)"/>
  <!-- neural network nodes -->
  <g stroke="#9fd3ef" stroke-width="2" fill="none" opacity=".9">
    <path d="M70 90 L140 60 L210 95 M70 90 L130 140 L210 95 M380 70 L450 110 L410 165 M380 70 L330 120 L410 165"/>
    <path d="M80 350 L150 380 L220 345 M300 350 L370 385 L440 340"/>
  </g>
  <g fill="#0b8fd8">
    <circle cx="70" cy="90" r="7"/><circle cx="140" cy="60" r="6"/><circle cx="210" cy="95" r="7"/><circle cx="130" cy="140" r="5"/>
    <circle cx="380" cy="70" r="6"/><circle cx="450" cy="110" r="7"/><circle cx="410" cy="165" r="5"/><circle cx="330" cy="120" r="6"/>
  </g>
  <g fill="#34c38f">
    <circle cx="80" cy="350" r="6"/><circle cx="150" cy="380" r="7"/><circle cx="220" cy="345" r="5"/>
    <circle cx="300" cy="350" r="6"/><circle cx="370" cy="385" r="7"/><circle cx="440" cy="340" r="5"/>
  </g>
  <!-- eye -->
  <path d="M80 230c50-72 112-108 180-108s130 36 180 108c-50 72-112 108-180 108S130 302 80 230z" fill="#fff" stroke="#0b8fd8" stroke-width="5"/>
  <circle cx="260" cy="230" r="72" fill="url(#iris)"/>
  <circle cx="260" cy="230" r="30" fill="#04192b"/>
  <circle cx="282" cy="206" r="13" fill="#fff" opacity=".9"/>
  <!-- detection frame -->
  <g stroke="#34c38f" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M170 150 h-30 v30"/><path d="M350 150 h30 v30"/><path d="M170 310 h-30 v-30"/><path d="M350 310 h30 v-30"/>
  </g>
  <rect x="140" y="226" width="240" height="6" rx="3" fill="url(#scan)"/>
  <!-- result card -->
  <g transform="translate(330 262)">
    <rect width="150" height="64" rx="14" fill="#fff" stroke="#d3edfb" stroke-width="2"/>
    <rect x="14" y="16" width="76" height="9" rx="4" fill="#0b8fd8"/>
    <rect x="14" y="34" width="120" height="8" rx="4" fill="#d3edfb"/>
    <rect x="14" y="34" width="70" height="8" rx="4" fill="#34c38f"/>
  </g>
</svg>
